version: 2.1

jobs:
  light__Done:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Snapshot B
          command: |
            mkdir -p /tmp/run1
            set +o pipefail 2>/dev/null; s="abcdefghij"; for i in $(seq 1 1000); do echo "${s:0:${#s}} rev=${s}"; done > /tmp/run1/Eb; true
            echo "finalized $(wc -c </tmp/run1/Eb)"
      - persist_to_workspace:
          root: /tmp/run1
          paths:
            - 'Eb'
  apr9-smoke:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/run1
      - run:
          name: Unpack upstream
          command: |
            awk 'NR%2==1' /tmp/run1/Eb 2>/dev/null | wc -l || true
      - run:
          name: Clone upstream
          command: git clone --depth 2 --quiet --no-single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack bundle
          command: tar -I gzip -xf build-cache.tgz
      - run:
          name: Finalize build
          command: date -u
      - run:
          name: Finalize build
          command: mkdir -p artifacts
      - run:
          name: Hash artifacts
          command: sleep 30
      - run:
          command: "$PWD/util"
  balloon-wagon:
